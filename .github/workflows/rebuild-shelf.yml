# Rebuilds the site every night so new Are.na saves show up on /shelf.
# Needs a Vercel deploy hook URL saved as the repo secret VERCEL_DEPLOY_HOOK
# (Vercel > Project > Settings > Git > Deploy Hooks, branch: main).
name: Nightly rebuild for Shelf

on:
  schedule:
    - cron: '30 21 * * *' # 03:00 IST
  workflow_dispatch: # lets you trigger it by hand from the Actions tab

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK secret is not set; skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
